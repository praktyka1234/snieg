<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>snieg</title>
    <link rel="stylesheet" href="snieg.css">
    <!-- <script src="snieg.js"></script> -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>


</head>
<body>
    <div class="tla">
    <div class="tlo"></div>
</div>

<div id="snieg"></div>

    <script>
   const kontener = document.getElementById("snieg");

        // Wysokość śniegu w różnych miejscach ekranu
        const szerokosc = 10;
        let kupki = [];

        function ustawSzerokosc() {
            const liczba = Math.ceil(window.innerWidth / szerokosc);

            kupki = Array(liczba).fill(0);
        }

        ustawSzerokosc();

        window.addEventListener("resize", ustawSzerokosc);

        function dodajSnieg() {

            const plat = document.createElement("div");

            plat.className = "plat";
            plat.textContent = "❄";

            const rozmiar = 15 + Math.random() * 15;

            const x = Math.random() * window.innerWidth;

            plat.style.left = x + "px";
            plat.style.fontSize = rozmiar + "px";

            const czas = 4 + Math.random() * 4;

            plat.style.animationDuration = czas + "s";

            kontener.appendChild(plat);

            const kolumna = Math.min(
                Math.floor(x / szerokosc),
                kupki.length - 1
            );

            const wysokosc = rozmiar * 0.7;

            plat.addEventListener("animationend", function() {

                plat.style.animation = "none";

                // Zwiększanie kupki śniegu
                kupki[kolumna] += wysokosc;

                // Zatrzymanie płatka na powierzchni śniegu
                plat.style.top = "auto";
                plat.style.bottom = kupki[kolumna] - wysokosc + "px";
                plat.style.left = x + "px";

                // Płatek zostaje na dole
            });
        }


 // Pierwsza porcja śniegu
        for (let i = 0; i < 30; i++) {
            dodajSnieg();
        }

        // Ciągłe opady
        setInterval(dodajSnieg, 250);     
    </script>
    <div class="tlo"></div>
    <div class="tla">
    <div class="tlo tlo1"></div>
    <div class="tlo tlo2"></div>
    <div class="tlo tlo3"></div>
    <div class="tlo tlo4"></div>
    </div>
<script>
$(document).ready(function() {

    const zdjecia = [
        "tlo1.jpg",
        "tlo2.jpg",
        "tlo3.jpg",
        "tlo4.jpg"
    ];

    let aktualne = 0;

    const pierwsze = $('<div class="tlo aktywne"></div>');
    const drugie = $('<div class="tlo"></div>');

    $(".tla").append(pierwsze, drugie);

    pierwsze.css("background-image", `url('${zdjecia[0]}')`);

    let aktywne = pierwsze;
    let nieaktywne = drugie;

    function zmienTlo() {

        aktualne = (aktualne + 1) % zdjecia.length;

        nieaktywne.css(
            "background-image",
            `url('${zdjecia[aktualne]}')`
        );

        nieaktywne.addClass("aktywne");
        aktywne.removeClass("aktywne");

        let pomocnicze = aktywne;
        aktywne = nieaktywne;
        nieaktywne = pomocnicze;
    }

    setInterval(zmienTlo, 5000);

});
</script>
</body>
</html>
